name: CI - Tests et Qualité de code

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer
    
    - name: Install dependencies
      run: composer install --no-progress
    
    - name: Run unit tests
      run: php vendor/phpunit/phpunit/phpunit
  
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer, phpcs, phpstan
    
    - name: Install dependencies
      run: composer install --no-progress
    
    - name: Check coding standards
      run: php vendor/bin/phpcs src/ --standard=PSR12
    
    - name: Static analysis
      run: php vendor/bin/phpstan analyse src/ --level=5